model_name: t5-small
seed: 42

# data
max_length: 256
val_split: 0.1          # fraction of TRAIN split carved out for validation
                         # test set is never touched until final evaluation

# training
batch_size: 32
learning_rate: 1e-5
epochs: 10
warmup_ratio: 0.1        # fraction of total steps used for LR warmup
grad_clip_norm: 1.0
early_stopping_patience: 3   # stop if val_accuracy doesn't improve for N epochs

# parameter-efficient fine-tuning: "none" = full fine-tuning (this config)
peft:
  method: none

# output
output_dir: outputs/full_finetune
checkpoint_name: best_model
